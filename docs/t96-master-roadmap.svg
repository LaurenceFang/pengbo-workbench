  <text x="64" y="170" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4b5563">Local-first financial research desktop roadmap across product, UI, AI, data, quant, workflows, release, safety, and commercial proof.</text>
  <text x="64" y="214" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#b91c1c">Boundary: T96 does not add hosted accounts, public APIs, remote sync, or new live-trading scope.</text>

